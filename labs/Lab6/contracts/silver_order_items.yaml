table: silver.order_items
purpose: Ítems de orden con montos válidos.
grain: Una fila por order_id y order_item_id.
primary_key: [order_id, order_item_id]
owner: Equipo Pudubella
lineage: [bronze.order_items]
classification: interno
required_columns:
  - order_id
  - order_item_id
  - product_id
  - seller_id
  - shipping_limit_date
  - price
  - freight_value
column_types:
  order_id: string
  order_item_id: integer
  product_id: string
  seller_id: string
  shipping_limit_date: string
  price: float
  freight_value: float
allow_empty: false
constraints:
  order_id:
    nullable: false
  order_item_id:
    nullable: false
  price:
    nullable: false
    minimum: 0
    finite: true
  freight_value:
    nullable: false
    minimum: 0
    finite: true
