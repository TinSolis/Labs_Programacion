table: gold.rfm_exclusions
purpose: Órdenes entregadas sin pago excluidas del RFM.
grain: Una fila por order_id excluida.
primary_key: [order_id]
owner: Equipo Pudubella
lineage: [silver.orders, silver.payments]
classification: interno
required_columns:
  - order_id
  - customer_id
  - order_purchase_timestamp
  - reason
column_types:
  order_id: string
  customer_id: string
  order_purchase_timestamp: datetime
  reason: string
allow_empty: true
constraints:
  order_id:
    nullable: false
    unique: true
  customer_id:
    nullable: false
  order_purchase_timestamp:
    nullable: false
  reason:
    nullable: false
